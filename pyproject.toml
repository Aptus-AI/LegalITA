[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ITA-benchmark"
version = "0.2.0"
description = "Benchmark open source per la valutazione di LLM su task di ragionamento giurisprudenziale italiano"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40,<1.0",
    "openai>=1.40,<2.0",
    "pydantic>=2.6,<3.0",
    "pandas>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "tqdm>=4.66,<5.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
legalita-audit-macro-aree = "legal_ita.cli.audit_macro_aree:main"
legalita-benchmark = "legal_ita.cli.benchmark:main"
legalita-build-corpus = "legal_ita.cli.build_corpus:main"
legalita-build-tasks = "legal_ita.cli.build_tasks:main"
legalita-charts = "legal_ita.cli.charts:main"
legalita-grounding = "legal_ita.cli.grounding:main"
legalita-mdd = "legal_ita.cli.mdd:main"
legalita-score-csv = "legal_ita.cli.score_external_csv:main"
legalita-score-mdd-csv = "legal_ita.cli.score_external_mdd:main"

[tool.setuptools.packages.find]
# Package veri e propri
include = ["benchmark*", "evaluation*", "legal_ita*"]
